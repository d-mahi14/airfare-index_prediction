# scraper/config/routes.yaml
# Route definitions for the APIx collection pipeline.
#
# Top 20 Indian domestic city-pairs by annual passenger volume (DGCA data).
# Route weights are loaded and normalized from data/reference/dgca_city_pair_traffic.csv.
#
# Fields:
#   origin:       IATA origin airport code
#   destination:  IATA destination airport code
#   route_code:   canonical identifier (origin-destination)
#   name:         human-readable route name
#   active:       whether this route is currently being collected

routes:
  # Mumbai <-> Delhi
  - origin: BOM
    destination: DEL
    route_code: BOM-DEL
    name: "Mumbai → Delhi"
    active: true

  - origin: DEL
    destination: BOM
    route_code: DEL-BOM
    name: "Delhi → Mumbai"
    active: true

  # Delhi <-> Bengaluru
  - origin: DEL
    destination: BLR
    route_code: DEL-BLR
    name: "Delhi → Bengaluru"
    active: true

  - origin: BLR
    destination: DEL
    route_code: BLR-DEL
    name: "Bengaluru → Delhi"
    active: true

  # Mumbai <-> Bengaluru
  - origin: BOM
    destination: BLR
    route_code: BOM-BLR
    name: "Mumbai → Bengaluru"
    active: true

  - origin: BLR
    destination: BOM
    route_code: BLR-BOM
    name: "Bengaluru → Mumbai"
    active: true

  # Delhi <-> Hyderabad
  - origin: DEL
    destination: HYD
    route_code: DEL-HYD
    name: "Delhi → Hyderabad"
    active: true

  - origin: HYD
    destination: DEL
    route_code: HYD-DEL
    name: "Hyderabad → Delhi"
    active: true

  # Mumbai <-> Hyderabad
  - origin: BOM
    destination: HYD
    route_code: BOM-HYD
    name: "Mumbai → Hyderabad"
    active: true

  - origin: HYD
    destination: BOM
    route_code: HYD-BOM
    name: "Hyderabad → Mumbai"
    active: true

  # Delhi <-> Kolkata
  - origin: DEL
    destination: CCU
    route_code: DEL-CCU
    name: "Delhi → Kolkata"
    active: true

  - origin: CCU
    destination: DEL
    route_code: CCU-DEL
    name: "Kolkata → Delhi"
    active: true

  # Mumbai <-> Kolkata
  - origin: BOM
    destination: CCU
    route_code: BOM-CCU
    name: "Mumbai → Kolkata"
    active: true

  - origin: CCU
    destination: BOM
    route_code: CCU-BOM
    name: "Kolkata → Mumbai"
    active: true

  # Delhi <-> Chennai
  - origin: DEL
    destination: MAA
    route_code: DEL-MAA
    name: "Delhi → Chennai"
    active: true

  - origin: MAA
    destination: DEL
    route_code: MAA-DEL
    name: "Chennai → Delhi"
    active: true

  # Mumbai <-> Chennai
  - origin: BOM
    destination: MAA
    route_code: BOM-MAA
    name: "Mumbai → Chennai"
    active: true

  - origin: MAA
    destination: BOM
    route_code: MAA-BOM
    name: "Chennai → Mumbai"
    active: true

  # Bengaluru <-> Hyderabad
  - origin: BLR
    destination: HYD
    route_code: BLR-HYD
    name: "Bengaluru → Hyderabad"
    active: true

  - origin: HYD
    destination: BLR
    route_code: HYD-BLR
    name: "Hyderabad → Bengaluru"
    active: true

# Lead-time windows to collect for each route (days before travel)
lead_time_days:
  - 1
  - 7
  - 15
  - 30
  - 45
