# config/sources.yaml
# Source registry configuration for Real-Time Indian Domestic Airfare Price Index (APIx)
#
# collection_mode options:
#   - recorded_fixture (default): Uses deterministic pre-recorded or mock fare quotes
#   - live_scrape: Live web collection (strictly requires robots.txt permission & human ToS sign-off)
#   - official_api: Official partner API endpoint
#   - disabled: Source is currently inactive
#
# NOTE: All tos_notes must remain "TO BE REVIEWED BY HUMAN" until formal legal/ethical review.

sources:
  - name: IndiGo
    type: airline
    base_url: https://www.goindigo.in
    collection_mode: recorded_fixture
    max_rps: 0.5
    robots_status: pending
    tos_notes: TO BE REVIEWED BY HUMAN
    last_checked: null
    search_paths_to_check:
      - /flight-search
      - /booking
      - /flights

