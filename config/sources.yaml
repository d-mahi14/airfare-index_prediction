# config/sources.yaml
# Source registry configuration for Real-Time Indian Domestic Airfare Price Index (APIx)
#
# collection_mode options:
#   - recorded_fixture: Uses deterministic pre-recorded/mock fare quotes
#   - live_scrape: Live web collection
#   - official_api: Official partner API endpoint
#   - disabled: Source is currently inactive
#
# IMPORTANT:
# - A source must NOT be changed to live_scrape until BOTH:
#     1. robots.txt has been reviewed, and
#     2. human ToS/ethical review has been completed.
# - Do not bypass robots.txt, authentication, CAPTCHA, rate limits,
#   anti-bot mechanisms, paywalls, or Terms of Service restrictions.
# - Until human review is completed, sources remain recorded_fixture.
#
# robots_status values:
#   - pending
#   - allowed
#   - disallowed
#
# tos_notes MUST remain "TO BE REVIEWED BY HUMAN" until the actual
# Terms of Service/access policy has been reviewed by a human.
#
# last_checked must remain null until the corresponding robots/ToS review
# has actually been performed.

sources:

  # ============================================================
  # AIRLINES
  # ============================================================

  - name: IndiGo
    type: airline
    base_url: https://www.goindigo.in
    collection_mode: recorded_fixture
    max_rps: 0.5
    robots_status: pending
    tos_notes: TO BE REVIEWED BY HUMAN
    last_checked: null
    search_paths_to_check:
      - /flight-search
      - /booking
      - /flights

